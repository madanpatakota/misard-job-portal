<app-auth-shell>

  <h1 class="auth-title">Create your account</h1>

  <p class="auth-subtitle">
    Register once to access verified .NET Core, Angular and SQL job opportunities.
  </p>

  <form (ngSubmit)="register()" novalidate>

    <div class="form-group">
      <label for="register-name">Full Name</label>

      <input id="register-name" type="text" name="fullName" [(ngModel)]="fullName" placeholder="Enter your full name"
        autocomplete="name" required>
    </div>

    <div class="form-group">
      <label for="register-email">Email</label>

      <input id="register-email" type="email" name="email" [(ngModel)]="email" placeholder="you@example.com"
        autocomplete="email" required>
    </div>

    <div class="form-row">

      <div class="form-group">
        <label for="register-password">Password</label>

        <div class="password-field">
          <input id="register-password" [type]="showPassword() ? 'text' : 'password'" name="password"
            [(ngModel)]="password" placeholder="Min. 6 characters" autocomplete="new-password" required>

          <button type="button" class="password-toggle" (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="register-confirm-password">Confirm Password</label>

        <input id="register-confirm-password" [type]="showPassword() ? 'text' : 'password'" name="confirmPassword"
          [(ngModel)]="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" required>
      </div>

    </div>

    @if (registrationError) {
    <p class="error-message">
      {{ registrationError }}
    </p>
    }

    <button type="submit" class="auth-button">
      Create Account
    </button>

  </form>

  <app-google-sign-in (signedIn)="googleSignedIn.emit($event)" />

  <p class="auth-switch">
    Already have an account?
    <button type="button" class="link-button" (click)="loginRequested.emit()">
      Login
    </button>
  </p>

</app-auth-shell>
