<app-auth-shell>

  <h1 class="auth-title">Welcome back</h1>

  <p class="auth-subtitle">
    Login to your candidate account to view the latest job opportunities.
  </p>

  @if (successMessage() && !errorMessage) {
  <p class="success-message">
    {{ successMessage() }}
  </p>
  }

  <form (ngSubmit)="login()" novalidate>

    <div class="form-group">
      <label for="login-email">Email</label>

      <input id="login-email" type="email" name="email" [(ngModel)]="email" placeholder="you@example.com"
        autocomplete="email" required>
    </div>

    <div class="form-group">
      <label for="login-password">Password</label>

      <div class="password-field">
        <input id="login-password" [type]="showPassword() ? 'text' : 'password'" name="password"
          [(ngModel)]="password" placeholder="Enter your password" autocomplete="current-password" required>

        <button type="button" class="password-toggle" (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
    </div>

    @if (errorMessage) {
    <p class="error-message">
      {{ errorMessage }}
    </p>
    }

    <button type="submit" class="auth-button">
      Login
    </button>

  </form>

  <app-google-sign-in (signedIn)="loggedIn.emit($event)" />

  <p class="auth-switch">
    New candidate?
    <button type="button" class="link-button" (click)="registerRequested.emit()">
      Create an account
    </button>
  </p>

</app-auth-shell>
